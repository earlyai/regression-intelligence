name: Early Regression Intelligence

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      job-id:
        description: "Dispatch job identifier (set by backend)"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run EarlyAI
        uses: earlyai/regression-intelligence@v1
        with:
          api-key: ${{ secrets.EARLY_AGENT_API_KEY }}
          job-id: ${{ inputs.job-id }}
