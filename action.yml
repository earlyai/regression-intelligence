name: 'EarlyAI CLI - Generate Impact or Catalog'
description: 'Composite action that runs the EarlyAI CLI impact or catalog command.'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  api-key:
    description: 'EarlyAI API key.'
    required: true
  job-id:
    description: 'Job id to process.'
    required: true
  cli-build:
    description: 'Which CLI build to install: qa or prod.'
    required: false
    default: 'prod'
  github-token:
    description: 'Token for GitHub Packages (read:packages). Only needed when cli-build is qa.'
    required: false
    default: ''
  node-options:
    description: 'NODE_OPTIONS passed to the CLI.'
    required: false
    default: '--max-old-space-size=5120'


runs:
  using: 'composite'
  steps:
    - name: Checkout target ref
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configure GitHub Packages registry (QA only)
      if: ${{ contains(inputs.cli-build, 'qa') }}
      uses: actions/setup-node@v4
      with:
        registry-url: 'https://npm.pkg.github.com'
        scope: '@earlyai'
        always-auth: true

    - name: Install @earlyai/cli
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        CLI_BUILD: ${{ inputs.cli-build }}
      run: |
        TAG=$([[ "$CLI_BUILD" == *"qa"* ]] && echo "$CLI_BUILD" || echo "latest")
        npm install -g "@earlyai/cli@$TAG" --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

    - name: Run early process-job
      id: run-cli
      shell: bash
      env:
        LOG_CONSOLE: "true"
        API_KEY: ${{ inputs.api-key }}
        TOKEN: ${{ inputs.github-token != '' && inputs.github-token || github.token }}
        EARLY_JOB_ID: ${{ inputs.job-id }}
        NODE_OPTIONS: ${{ inputs.node-options }}
      run: |
        early process-job
